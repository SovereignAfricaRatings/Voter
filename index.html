<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ward election intelligence: demonstration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F2F4F1;--sheet:#FBFCFA;--ink:#17262B;--muted:#586869;--line:#CDD5D0;--soft:#E8ECE8;
  --side:#14252B;--side-ink:#C9D6D3;--side-on:#24393F;--side-strong:#FFFFFF;
  --select:#C98A00;--warn:#A8371F;--ok:#2F6B4F;--flag-bg:#F4DF9B;--flag-ink:#3A2A00;
  --c0:#E3ECE6;--c1:#B4CFC4;--c2:#74A69D;--c3:#33737A;--c4:#12323F;
  --neg:#B5533C;--mid:#E6E9E5;--pos:#2F6F8F;
  --ANC:#1F7A3E;--DA:#1F5FA8;--EFF:#C0262D;--MK:#2A2A2A;--MKfg:#fff;--IFP:#C99A00;--PA:#0E8F8F;--ASA:#6BAA2C;--VF:#E57A17;--OTH:#8A9299;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11181A;--sheet:#182124;--ink:#E6ECEA;--muted:#9FB0AF;--line:#2E3B3E;--soft:#1F2A2D;
  --side:#0B1113;--side-ink:#A9B8B6;--side-on:#1B272A;--side-strong:#FFFFFF;
  --select:#F0B429;--warn:#F08A6E;--ok:#6FC79A;--flag-bg:#4A3A08;--flag-ink:#FBE9A8;
  --c0:#22302F;--c1:#2F4F4B;--c2:#3F7A74;--c3:#62A9A6;--c4:#B7E3DC;--mid:#263234;--MK:#C9C9C9;--MKfg:#17262B;--OTH:#7C858B;}}
:root[data-theme="dark"]{
  --paper:#11181A;--sheet:#182124;--ink:#E6ECEA;--muted:#9FB0AF;--line:#2E3B3E;--soft:#1F2A2D;
  --side:#0B1113;--side-ink:#A9B8B6;--side-on:#1B272A;--side-strong:#FFFFFF;
  --select:#F0B429;--warn:#F08A6E;--ok:#6FC79A;--flag-bg:#4A3A08;--flag-ink:#FBE9A8;
  --c0:#22302F;--c1:#2F4F4B;--c2:#3F7A74;--c3:#62A9A6;--c4:#B7E3DC;--mid:#263234;--MK:#C9C9C9;--MKfg:#17262B;--OTH:#7C858B;}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Archivo",system-ui,"Segoe UI",Arial,sans-serif;
  font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--select);outline-offset:2px}

/* ------------------------------------------------------------ app shell */
#app{min-height:100%;display:grid;grid-template-columns:212px minmax(0,1fr)}
.side{background:var(--side);color:var(--side-ink)}
.side-in{position:sticky;top:env(safe-area-inset-top,0px);padding:20px 12px}
.brand{color:var(--side-strong);font-size:17px;font-weight:650;font-stretch:84%;line-height:1.15;padding:0 10px 18px}
.brand small{display:block;font-weight:400;font-size:12.5px;font-stretch:100%;color:var(--side-ink);margin-top:4px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:0;background:none;
  color:inherit;padding:8px 10px;border-radius:4px}
.side nav button:hover{background:var(--side-on)}
.side nav button[aria-current="page"]{background:var(--side-on);color:var(--side-strong);font-weight:600;box-shadow:inset 3px 0 0 var(--select)}
.side nav .gap{height:14px}
.pill{font-size:11.5px;padding:0 6px;border-radius:9px;background:var(--select);color:#17262B;font-weight:600}
.content{min-width:0}
.flag{background:var(--flag-bg);color:var(--flag-ink);padding:6px 28px;font-size:13px}
.flag b{font-weight:650}
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:9px 28px;background:var(--sheet);border-bottom:1px solid var(--line)}
.top .run{margin-left:auto;color:var(--muted);font-size:13px}
.page{padding:26px 28px 72px;max-width:1260px}
.phead{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.phead h1{font-size:31px;font-weight:650;font-stretch:78%;line-height:1.05;margin:0}
.phead p{margin:6px 0 0;color:var(--muted);max-width:70ch}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctrls label{display:flex;gap:6px;align-items:center;color:var(--muted)}

/* --------------------------------------------------------------- controls */
select,input[type=number]{padding:6px 8px;border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink)}
.btn{padding:6px 12px;border:1px solid var(--ink);border-radius:4px;background:var(--sheet)}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn.primary:hover{opacity:.88}
.btn.quiet{border-color:var(--line)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;font-weight:600;text-align:left}
.link:hover{text-decoration-color:var(--ink)}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:6px 11px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* ----------------------------------------------------------------- blocks */
.stack{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:16px 18px;min-width:0}
.card h2{font-size:15px;font-weight:650;margin:0 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card p{margin:4px 0}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.sub{color:var(--muted)}
.small{font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.stat{background:var(--sheet);padding:12px 16px}
.stat span{display:block;color:var(--muted);font-size:12.5px}
.stat b{display:block;font-size:24px;font-weight:600;font-stretch:82%;line-height:1.2}
.stat small{display:block;color:var(--muted);font-size:12.5px}
.stat:last-child{grid-column-end:-1}
.stat b em{font-style:normal}
.stat b em.long{display:block;font-size:14.5px;font-stretch:100%;font-weight:500;line-height:1.4;padding:3px 0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 16px}
.kv div span{display:block;color:var(--muted);font-size:12.5px}
.kv div b{font-weight:600;font-size:15px}
.box{border:1px dashed var(--line);border-radius:4px;padding:10px 12px;background:var(--paper);font-size:13px}
.assume{font-size:12.5px;color:var(--muted);border-left:2px dashed var(--ink);padding-left:10px;margin-top:10px}

.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:2px;border:1.5px solid var(--ink);font-stretch:90%;white-space:nowrap}
.tag.FACT{background:var(--ink);color:var(--sheet)}
.tag.MEASUREMENT{background:var(--c1);border-color:var(--c3);color:#12323F}
.tag.MODELLED{background:none}
.tag.ASSUMPTION{background:none;border-style:dashed}
.tag.SYN{border-color:var(--flag-ink);background:var(--flag-bg);color:var(--flag-ink);border-style:dotted}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 12px 6px 0;vertical-align:bottom;white-space:nowrap}
td{padding:7px 12px 7px 0;border-bottom:1px solid var(--soft);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
td small{color:var(--muted)}
table.tight td{white-space:nowrap}
table.c1 td:first-child{white-space:nowrap}
.link{white-space:nowrap}
tbody tr.pick:hover{background:var(--soft)}
.sorth{border:0;background:none;padding:0;font-weight:600;color:var(--muted)}
.sorth[aria-pressed="true"]{color:var(--ink)}
.best{font-weight:650}
.up{color:var(--ok)}.down{color:var(--warn)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}

/* party composition strip */
.strip{display:flex;height:14px;border-radius:2px;overflow:hidden;min-width:110px;background:var(--soft)}
.strip i{display:block;height:100%}
.strip + small{display:block;margin-top:3px}

/* ward tiles */
.tiles{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.tile{aspect-ratio:1/0.82;border:1px solid rgba(23,38,43,.25);border-radius:3px;padding:4px 5px;text-align:left;line-height:1.15;
  display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.tile:hover{filter:brightness(1.08)}
.tile b{font-weight:650;font-size:13px}
.tile span{font-size:11.5px;white-space:nowrap}
.legend{margin-top:12px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend i{display:inline-block;width:14px;height:10px;margin-right:5px;border:1px solid rgba(23,38,43,.3);vertical-align:baseline}

/* share bars */
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:4px 0}
.track{position:relative;height:18px;background:var(--soft);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.whisk{position:absolute;top:50%;height:2px;background:var(--ink);transform:translateY(-50%)}
.whisk::before,.whisk::after{content:"";position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.whisk::before{left:0}.whisk::after{right:0}
.row .val{text-align:right;font-size:13px}
.row .val small{color:var(--muted);font-size:12px;display:block}


/* South Africa map */
.samap{width:100%;height:auto;display:block}
.samap.small{max-width:340px}
.prov{stroke:var(--sheet);stroke-width:1.5;cursor:pointer;transition:filter .12s}
.prov:hover,.prov:focus-visible{filter:brightness(1.12);stroke:var(--ink);stroke-width:2;outline:none}
.prov.on{stroke:var(--select);stroke-width:4}
.plabel{font-size:15px;font-weight:600;font-stretch:88%;text-anchor:middle;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.plabel.tiny{font-size:12px}
.grid2.wide{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
tr.grp th{padding-top:16px;color:var(--ink);font-size:12.5px;border-bottom:1px solid var(--line);background:none}
.tiles.dense{gap:3px}
.tiles.dense .tile{padding:2px 3px;aspect-ratio:1/1}
.tiles.dense .tile span{display:none}
.tiles.dense .tile b{font-size:11.5px}
@media (prefers-reduced-motion:reduce){.prov{transition:none}}
.form{display:grid;gap:10px}
.form label{display:block;font-size:12.5px;color:var(--muted)}
.form select,.form input{width:100%;margin-top:3px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.params{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 20px}
.params label{font-size:12.5px;color:var(--muted);display:block}
.params input{width:92px;margin-top:3px}
.layerrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--soft);align-items:start}
.layerrow:last-child{border-bottom:0}
.layerrow input{margin-top:4px;width:16px;height:16px}
.layerrow b{font-weight:600}
.layerrow.off b{color:var(--muted)}
.steps{display:grid;gap:18px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px}
.step>i{font-style:normal;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:650}
.step.done>i{background:var(--ink);color:var(--sheet)}

@media (max-width:920px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side-in{position:static;padding:10px 12px 8px}
  .brand{padding:0 6px 8px;font-size:15px}.brand small{display:none}
  .side nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .side nav button{white-space:nowrap;padding:7px 10px}
  .side nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--select)}
  .side nav .gap{display:none}
  .flag,.top{padding-left:16px;padding-right:16px}
  .top .run{margin-left:0}
  .page{padding:18px 16px 56px}
  .phead h1{font-size:26px}
  .grid2,.grid2.even,.grid2.wide{grid-template-columns:minmax(0,1fr)}
  .sticky{position:static}
  .row{grid-template-columns:40px minmax(0,1fr) 132px}
}
@media (max-width:520px){.tile span{display:none}.tile{aspect-ratio:1/1}}
</style>
</head>

<div id="app"></div>

function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function eventField(events,day,beta,propN,muniW){

function scoreOne(o,tr){ // o: per-ward {sh,lo,hi,turnout}

const TAGS={FACT:"Fact",MEASUREMENT:"Measurement",MODELLED:"Modelled",ASSUMPTION:"Assumption"};
const tag=t=>`<span class="tag ${t}">${TAGS[t]}</span>`, syn=`<span class="tag SYN">Synthetic</span>`;
const sw=i=>`<i class="swatch" style="background:var(--${PARTIES[i].id})"></i>`;
const stamp=d=>d.toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",second:"2-digit"});
const DRIVER={later:"Later elections",structural:"Structural conditions",events:"Local events",candidates:"Candidates"};
const wardLink=(w,label)=>`<button class="link" data-act="ward" data-id="${w.id}">${label||"Ward "+w.no}</button>`;
const wardName=w=>MUNIS[w.mi].name+" "+w.no;
const provSelect=(key,val,all)=>`<select data-sel="${key}">${all?`<option value="ALL" ${val==="ALL"?"selected":""}>All nine provinces</option>`:""}${
  PROV_ORDER.map(p=>`<option value="${p}" ${p===val?"selected":""}>${PROVS[p]}</option>`).join("")}</select>`;
const muniSelect=(key,prov,val)=>`<select data-sel="${key}">${MUNIS.filter(m=>m.prov===prov).map(m=>`<option value="${m.code}" ${m.code===val?"selected":""}>${m.name} (${m.n})</option>`).join("")}</select>`;
const head=(title,sub,ctrls,crumbs)=>`<div class="phead"><div>${crumbs?`<div class="crumbs">${crumbs}</div>`:""}<h1>${title}</h1>${sub?`<p>${sub}</p>`:""}</div>${ctrls?`<div class="ctrls">${ctrls}</div>`:""}</div>`;
const stat=(label,value,note)=>`<div class="stat"><span>${label}</span><b>${value}</b>${note?`<small>${note}</small>`:""}</div>`;
const crumb=(...parts)=>parts.map(p=>p[1]?`<button class="link" data-act="${p[1]}" data-id="${p[2]||""}">${p[0]}</button>`:p[0]).join(" / ");
const NAV=[["map","Map and wards"],["changes","What changed"],null,["events","Events"],["candidates","Candidates"],["polls","Poll comparison"],null,
  ["validation","Validation"],["audit","Audit trail"],["settings","Model settings"]];

function tileStyle(w){const r=S.res[w.ix];
  if(S.mapMode==="leader"){const p=PARTIES[r.leader];return [`background:var(--${p.id});color:${p.id==="MK"?"var(--MKfg)":p.dark?"#fff":"#17262B"}`,ab(r.leader)+" "+pc(r.B[r.leader],0)]}
  if(S.mapMode==="margin"){const i=[.05,.10,.20,.35,9].findIndex(s=>r.margin<s);return [`background:var(--c${4-i});color:${i<2?"var(--paper)":"var(--ink)"}`,pc(r.margin,0)+" lead"]}
  if(S.mapMode==="move"){const d=r.B[w.inc]-w.base[w.inc], a=clamp(Math.abs(d)/.2,0,1);
    return [`background:color-mix(in srgb,var(--${d<0?"neg":"pos"}) ${Math.round(a*100)}%,var(--mid));color:${a>.55?"#fff":"var(--ink)"}`,pt(d,0)]}
  const i=[45,55,65,75,999].findIndex(s=>r.conf<s);return [`background:var(--c${i});color:${i>2?"var(--paper)":"var(--ink)"}`,r.conf+" / 100"]}
const LEGENDS={leader:()=>PARTIES.map((p,i)=>`<span><i style="background:var(--${p.id})"></i>${ab(i)}</span>`).join(""),
  margin:()=>["Under 5 pts","5 to 10","10 to 20","20 to 35","Over 35"].map((t,i)=>`<span><i style="background:var(--c${4-i})"></i>${t}</span>`).join(""),
  move:()=>`<span><i style="background:var(--neg)"></i>Incumbent losing share</span><span><i style="background:var(--mid)"></i>Little change</span><span><i style="background:var(--pos)"></i>Incumbent gaining</span>`,
  conf:()=>["Under 45","45 to 55","55 to 65","65 to 75","Over 75"].map((t,i)=>`<span><i style="background:var(--c${i})"></i>${t}</span>`).join("")};
const MODES=[["leader","Leading party","Leading party in output B and its estimated share."],["margin","Competitiveness","Lead of the first party over the second. Darker is closer."],
  ["move","Movement","Change in the incumbent party's share since the rebuilt baseline."],["conf","Confidence","Evidence confidence: completeness, freshness and model uncertainty."]];
function bars(sh,lo,hi,extra){const mx=Math.min(1,Math.ceil(Math.max(...hi)*10)/10)||1;
  return sh.map((v,i)=>({v,i})).filter(o=>o.v>=.02||o.i===8).sort((a,b)=>b.v-a.v).map(({v,i})=>
   `<div class="row"><span title="${esc(PARTIES[i].name)}">${ab(i)}</span><div class="track"><div class="fill" style="width:${v/mx*100}%;background:var(--${PARTIES[i].id});opacity:.85"></div>
    <div class="whisk" style="left:${lo[i]/mx*100}%;width:${Math.max((hi[i]-lo[i])/mx*100,.5)}%"></div></div>
    <span class="val">${pc(v)}<small>${pc(lo[i],0)} to ${pc(hi[i],0)}${extra?extra(i):""}</small></span></div>`).join("")}
function rollup(munis){const t={lead:new Array(NP).fill(0),close:0,diff:0,mv:0,conf:0,n:0,munis:munis.length};
  munis.forEach(m=>{const s=S.sum[m.mi]; s.lead.forEach((v,i)=>t.lead[i]+=v); t.close+=s.close; t.diff+=s.diff; t.mv+=s.mv; t.conf+=s.conf; t.n+=s.n}); return t}
const strip=s=>`<div class="strip" role="img" aria-label="Wards led by each party">${s.lead.map((n,i)=>n?`<i style="width:${n/s.n*100}%;background:var(--${PARTIES[i].id})" title="${ab(i)} ${n}"></i>`:"").join("")}</div>
  <small class="sub">${s.lead.map((n,i)=>({n,i})).filter(x=>x.n).sort((a,b)=>b.n-a.n).slice(0,4).map(x=>ab(x.i)+" "+x.n).join(", ")}</small>`;
const LABEL_NUDGE={NW:[-42,14],MP:[30,26],GT:[2,-2],LIM:[0,6],KZN:[-8,8]};
const CLOSE_BINS=[.08,.11,.14,.18,9], CLOSE_LABELS=["Under 8%","8 to 11%","11 to 14%","14 to 18%","Over 18%"];
function saMap(selected,small){
  return `<svg class="samap ${small?"small":""}" viewBox="0 0 ${PROVMAP.w} ${PROVMAP.h}" role="group" aria-label="Map of South Africa by province">${
   PROVMAP.prov.map(p=>{const t=rollup(MUNIS.filter(m=>m.prov===p.code)), i=CLOSE_BINS.findIndex(s=>t.close/t.n<s);
    return `<path d="${p.d}" class="prov ${selected===p.code?"on":""}" style="fill:var(--c${i})" data-act="prov" data-id="${p.code}" tabindex="0" role="button" aria-label="${PROVS[p.code]}: ${t.n} wards, ${t.close} close contests"><title>${PROVS[p.code]}: ${t.munis} municipalities, ${num(t.n)} wards, ${t.close} close contests</title></path>`}).join("")}${
   small?"":PROVMAP.prov.map(p=>{const o=LABEL_NUDGE[p.code]||[0,0];return `<text x="${p.lx+o[0]}" y="${p.ly+o[1]}" class="plabel ${p.code==="GT"?"tiny":""}">${PROVS[p.code]}</text>`}).join("")}</svg>`}

// ------------------------------------------------------------- South Africa
function pageMap(){const left=ELECTION-S.day, all=rollup(MUNIS), inModel=S.events.filter(e=>e.verified&&e.day<=S.day).length, c=S.changes;
  return head("South Africa","Select a province on the map or in the table, then a municipality, then a ward.")+`<div class="stack">
  <div class="stats">${stat("Days to election",left,"4 November 2026")}${stat("Municipalities",MUNIS.length,"8 metropolitan, "+(MUNIS.length-8)+" local")}${stat("Wards",num(WARDS.length),"2016 ward list; see note below")}
   ${stat("Close contests",num(all.close),"Lead under 5 points")}${stat("Incumbent not leading",num(all.diff),"Leading party differs from the incumbent")}${stat("Events in the model",inModel,"Verified, dated on or before today")}</div>
  <div class="grid2"><div class="card"><h2>Provinces ${tag("MODELLED")} ${syn}</h2>${saMap(null)}
    <div class="legend"><span>Share of wards that are close contests:</span>${CLOSE_LABELS.map((t,i)=>`<span><i style="background:var(--c${i})"></i>${t}</span>`).join("")}</div>
    <p class="sub small">Province outlines are real (Natural Earth). The shading comes from the synthetic model.</p></div>
   <div class="card"><h2>By province</h2><div class="scroll"><table><thead><tr><th>Province</th><th class="n">Wards</th><th>Wards led by each party</th><th class="n">Close</th></tr></thead><tbody>${
    PROV_ORDER.map(p=>{const t=rollup(MUNIS.filter(m=>m.prov===p));return `<tr class="pick"><td><button class="link" data-act="prov" data-id="${p}">${PROVS[p]}</button><br><small>${t.munis} municipalities</small></td><td class="n">${num(t.n)}</td><td>${strip(t)}</td><td class="n">${t.close}</td></tr>`}).join("")}</tbody></table></div></div></div>
  <div class="grid2 even"><div class="card"><h2>Latest model run</h2>${c?`<p><b>${c.run}</b>, ${stamp(c.ts)}</p><p>${esc(c.trigger)}.</p>
     <p class="sub">${num(c.list.length)} wards moved by more than 0.1 points; the leading party changed in ${c.list.filter(x=>x.lead0!==x.lead1).length}.</p>
     <p><button class="btn quiet" data-act="nav" data-id="changes">See what changed</button></p>`
     :`<p><b>${S.runs[0].id}</b>, ${stamp(S.runs[0].ts)}</p><p>${esc(S.runs[0].trigger)}.</p><p class="sub">Advance the model date or record an event to see wards move.</p>
     <p><button class="btn quiet" data-act="nav" data-id="events">Record an event</button></p>`}</div>
   <div class="card"><h2>What is real here ${tag("FACT")}</h2>
    <table><tbody><tr><td>Election day</td><td>4 November 2026</td></tr><tr><td>Candidates</td><td>136,790 certified <small>Electoral Commission, 16 September 2026</small></td></tr>
    <tr><td>Municipalities</td><td>All 213 that elect ward councillors, with their real names, districts and provinces. The 44 district councils have no wards: 40% of their seats are elected by proportional vote and the rest are appointed by the local councils.</td></tr>
    <tr><td>Wards</td><td>${num(WARDS.length)} wards, numbered as in the 2016 delimitation <small>OpenUp</small>. The 2026 delimitation has 4,488; that list loads from the Municipal Demarcation Board in the production build.</td></tr></tbody></table></div></div></div>`}

// ----------------------------------------------------------------- province
function pageProvince(){const ms=MUNIS.filter(m=>m.prov===S.prov), t=rollup(ms); let lastD=null;
  const evs=S.events.filter(e=>e.verified&&e.day<=S.day&&MUNIS[e.mi].prov===S.prov).length;
  return head(PROVS[S.prov],"Select a municipality to see its wards.",`<label>Province ${provSelect("prov",S.prov)}</label>`,crumb(["South Africa","nav","map"],[PROVS[S.prov]]))+`<div class="stack">
  <div class="stats">${stat("Municipalities",t.munis,ms.filter(m=>m.metro).length+" metropolitan")}${stat("Wards",num(t.n))}${stat("Close contests",t.close,"Lead under 5 points")}
   ${stat("Incumbent not leading",t.diff)}${stat("Average confidence",Math.round(t.conf/t.n)+" / 100")}${stat("Events in the model",evs)}</div>
  <div class="grid2 wide"><div class="card"><h2>Municipalities ${tag("MODELLED")} ${syn}</h2><div class="scroll"><table><thead><tr><th>Municipality</th><th class="n">Wards</th><th>Wards led by each party</th><th class="n">Close</th><th class="n">Incumbent trailing</th><th class="n">Confidence</th></tr></thead><tbody>${
    ms.map(m=>{const s=S.sum[m.mi], g=m.distName!==lastD?`<tr class="grp"><th colspan="6">${m.metro?"Metropolitan municipalities":m.distName+" District"}</th></tr>`:""; lastD=m.distName;
     return g+`<tr class="pick"><td><button class="link" data-act="muni" data-id="${m.code}">${m.name}</button><br><small>${m.code}</small></td><td class="n">${m.n}</td><td>${strip(s)}</td>
      <td class="n">${s.close}</td><td class="n">${s.diff}</td><td class="n">${Math.round(s.conf/s.n)}</td></tr>`}).join("")}</tbody></table></div></div>
   <div class="card sticky"><h2>Other provinces</h2>${saMap(S.prov,true)}<p class="sub small">Select a province to switch.</p></div></div></div>`}

// ------------------------------------------------------------- municipality
function pageMuni(){const m=muniOf(S.muni), ws=wardsOf(m), mode=MODES.find(x=>x[0]===S.mapMode), s=S.sum[m.mi];
  const val={no:w=>w.no,leader:w=>ab(S.res[w.ix].leader),share:w=>S.res[w.ix].B[S.res[w.ix].leader],margin:w=>S.res[w.ix].margin,
    move:w=>S.res[w.ix].B[w.inc]-w.base[w.inc],conf:w=>S.res[w.ix].conf}[S.sort.key];
  const rows=ws.slice().sort((a,b)=>{const x=val(a),y=val(b);return (x<y?-1:x>y?1:a.no-b.no)*S.sort.dir});
  const th=(k,l,n)=>`<th class="${n?"n":""}" aria-sort="${S.sort.key===k?(S.sort.dir>0?"ascending":"descending"):"none"}"><button class="sorth" data-act="sort" data-id="${k}" aria-pressed="${S.sort.key===k}">${l}${S.sort.key===k?(S.sort.dir>0?" ↑":" ↓"):""}</button></th>`;
  return head(m.name,`${m.metro?"Metropolitan municipality":"Local municipality in "+m.distName+" District"}, ${PROVS[m.prov]}. ${m.n} wards. Select a ward to open its page.`,
    `<label>Municipality ${muniSelect("muni",m.prov,m.code)}</label><div class="seg" role="group" aria-label="Colour wards by">${MODES.map(([k,l])=>`<button data-act="mode" data-id="${k}" aria-pressed="${S.mapMode===k}">${l}</button>`).join("")}</div>`,
    crumb(["South Africa","nav","map"],[PROVS[m.prov],"prov",m.prov],[m.name]))+`<div class="stack">
  <div class="stats">${stat("Wards",m.n)}${stat("Wards led by each party",`<em class="long">${s.lead.map((n,i)=>({n,i})).filter(x=>x.n).sort((a,b)=>b.n-a.n).map(x=>ab(x.i)+" "+x.n).join(", ")}</em>`)}
   ${stat("Close contests",s.close,"Lead under 5 points")}${stat("Incumbent not leading",s.diff)}${stat("Service-stress index",m.stress.toFixed(2),"0 is low, 1 is high. Synthetic")}</div>
  <div class="grid2 even"><div class="card sticky"><h2>Wards 1 to ${m.n} ${syn}</h2>
    <div class="tiles ${m.cols>10?"dense":""}" style="grid-template-columns:repeat(${m.cols},minmax(0,1fr));max-width:${m.cols*84}px">${ws.map(w=>{const [st,txt]=tileStyle(w);return `<button class="tile" style="${st}" data-act="ward" data-id="${w.id}" aria-label="Ward ${w.no}: ${txt}" title="Ward ${w.no}: ${txt}"><b>${w.no}</b><span>${txt}</span></button>`}).join("")}</div>
    <div class="legend">${LEGENDS[S.mapMode]()}</div><p class="sub small">${mode[2]}</p>
    <p class="sub small">Schematic layout. Tile positions and which wards adjoin each other are placeholders, not real geography; the production build draws the Municipal Demarcation Board's 2026 ward boundaries.</p></div>
   <div class="card"><h2>Ward list ${tag("MODELLED")}</h2><div class="scroll"><table class="tight"><thead><tr>${th("no","Ward")}${th("leader","Leading")}${th("share","Share",1)}${th("margin","Lead",1)}${th("move","Incumbent movement",1)}${th("conf","Confidence",1)}</tr></thead><tbody>${
    rows.map(w=>{const r=S.res[w.ix], d=r.B[w.inc]-w.base[w.inc];return `<tr class="pick"><td>${wardLink(w)}</td><td>${sw(r.leader)}${ab(r.leader)}</td><td class="n">${pc(r.B[r.leader])}</td>
      <td class="n">${pt(r.margin)}</td><td class="n ${d<0?"down":"up"}">${ab(w.inc)} ${pt(d)}</td><td class="n">${r.conf}</td></tr>`}).join("")}</tbody></table></div></div></div></div>`}

// ---------------------------------------------------------------- ward detail
function pageWard(){const w=wardById(S.ward), m=MUNIS[w.mi], r=S.res[w.ix], o=S.out[w.ix], cand=w.cand, R=REGIONS[w.region], win=leadChance(w), cl=candList(w);
  const sb=w.base.slice().sort((a,b)=>b-a), d=r.B[w.inc]-w.base[w.inc];
  const candTxt=cand.standing?`Sitting councillor ${cl.councillor} (${ab(w.inc)}) is standing again`
    :cand.switchTo!==null?`Sitting councillor ${cl.councillor} now stands for the ${ab(cand.switchTo)}; ${cl.incRow.name} stands for the ${ab(w.inc)}`
    :`${cl.incRow.name} stands for the ${ab(w.inc)} in place of sitting councillor ${cl.councillor}`;
  const show=PARTIES.map((p,i)=>i).filter(i=>i===8||Math.max(o.A.sh[i],o.B.sh[i],o.C.sh[i])>=.03).sort((a,b)=>o.C.sh[b]-o.C.sh[a]);
  const cell=(x,i)=>`<td class="n ${argmax(x.sh)===i?"best":""}">${pc(x.sh[i])}<br><small>${pc(x.lo[i],0)} to ${pc(x.hi[i],0)}</small></td>`;
  const pollSrc=o.A.src==="ward"?`Ward survey of ${w.survey.n} interviews, fieldwork ${fmt(w.survey.from)} to ${fmt(w.survey.to)}.`
    :`No ward survey. The ${R.label} of ${R.n} interviews (${fmt(R.from)} to ${fmt(R.to)}) is applied to this ward as a uniform swing.`;
  const evs=r.evs.slice().sort((a,b)=>b.weight-a.weight);
  const step=k=>`<button class="btn quiet" data-act="ward" data-id="${m.code}-${w.no+k}" ${w.no+k<1||w.no+k>m.n?"disabled":""}>${k<0?"Previous ward":"Next ward"}</button>`;
  return head(`Ward ${w.no}, ${m.name}`,`${PROVS[m.prov]}. ${w.settle}. ${candTxt}.${cl.bigIndep?" "+cl.bigIndep.name+" is standing as a prominent independent.":""}`,
    `${step(-1)}${step(1)}<button class="btn" data-act="eventHere">Record an event here</button>`,
    crumb(["South Africa","nav","map"],[PROVS[m.prov],"prov",m.prov],[m.name,"muni",m.code],["Ward "+w.no]))+`<div class="stack">
  <div class="stats">${stat("Leading in output B",sw(r.leader)+ab(r.leader)+" "+pc(r.B[r.leader]),"Leads in "+pc(win[r.leader],0)+" of "+MC+" simulations")}
   ${stat("Lead over second party",pt(r.margin),r.enp.toFixed(1)+" effective parties")}${stat("Turnout estimate",pc(r.turnout),pc(r.tLo,0)+" to "+pc(r.tHi,0)+", modelled separately")}
   ${stat("Incumbent movement",`<em class="${d<0?"down":"up"}">${ab(w.inc)} ${pt(d)}</em>`,"Since the rebuilt baseline")}
   ${stat("Evidence confidence",r.conf+" / 100","Data "+pc(w.complete,0)+" complete, freshness "+pc(r.fresh,0))}</div>
  <div class="grid2"><div class="stack">
    <div class="card"><h2>Estimated vote share, output B ${tag("MODELLED")} ${syn}</h2>${bars(r.B,r.lo,r.hi,i=>win[i]>=.005?", leads in "+pc(win[i],0):"")}
     <p class="sub small">Bars are estimated shares. The line is the 80% interval. "Leads in" is the share of ${MC} simulations in which the party comes first.</p></div>
    <div class="card"><h2>Candidates ${syn}</h2>
     <p class="sub small">${cl.total} candidates on the ward ballot: ${cl.named} from the parties listed${cl.indep?", "+cl.indep+" independent":""}${cl.others?" and "+cl.others+" from other parties":""}.</p>
     <div class="scroll"><table class="c1"><thead><tr><th>Party</th><th>Candidate</th><th>Stood in 2021</th><th class="n">Local mentions</th><th class="n">Effect on share</th></tr></thead><tbody>${
      cl.rows.map(c=>{const e=c.party===8?null:r.contrib.candidates[c.party];return `<tr><td>${sw(c.party)}${c.label}</td><td><b>${c.name}</b><br><small>${c.status}</small></td><td>${c.stood?"Yes":"No"}</td><td class="n">${c.mentions}</td>
       <td class="n ${e===null?"":e<0?"down":"up"}">${e===null?"<small>in Other</small>":pt(e)}</td></tr>`}).join("")}${
      cl.others||cl.indep?`<tr><td>${sw(8)}Other parties${cl.indep?" and independents":""}</td><td>${cl.others} further candidate${cl.others===1?"":"s"}</td><td></td><td></td><td class="n ${r.contrib.candidates[8]<0?"down":"up"}">${pt(r.contrib.candidates[8])}</td></tr>`:""}</tbody></table></div>
     <p class="sub small">"Effect on share" is what the candidate layer adds to or takes from each party in this ward${S.layers.candidates?"":" (the layer is switched off)"}. Local mentions counts recorded events and media items naming the candidate.</p>
     <p class="assume">${syn} The names are generated for this demonstration and do not refer to real people. The production build shows the Electoral Commission's certified candidate list, with a source and date on every attribute.</p></div>
    <div class="card"><h2>Poll comparison ${tag("MEASUREMENT")} ${tag("MODELLED")} ${syn}</h2>
     <div class="scroll"><table><thead><tr><th>Party</th><th class="n">A. Poll only</th><th class="n">B. Model without polls</th><th class="n">C. Combined</th></tr></thead>
     <tbody>${show.map(i=>`<tr><td>${sw(i)}${ab(i)}</td>${cell(o.A,i)}${cell(o.B,i)}${cell(o.C,i)}</tr>`).join("")}
     <tr><td>Turnout</td><td class="n">${pc(o.A.turnout)}<br><small>stated intention</small></td><td class="n">${pc(o.B.turnout)}</td><td class="n">${pc(o.C.turnout)}</td></tr></tbody></table></div>
     <p class="sub small">${pollSrc} ${S.layers.polls?`In output C the poll carries ${pc(o.C.pollWeight,0)} of the weight in this ward.`:"The poll layer is switched off, so C equals B."} Bold marks the leading party in each output.</p>
     ${o.A.src!=="ward"?`<p class="assume">${tag("ASSUMPTION")} Applying a ${o.A.src==="metro"?"metro":"provincial"} poll to a ward assumes every ward moved by the same amount. Extra uncertainty of 5 points is added for it.</p>`:""}</div></div>
   <div class="stack">
    <div class="card"><h2>Ward snapshot ${tag("FACT")} ${syn}</h2><div class="kv"><div><span>Incumbent party</span><b>${sw(w.inc)}${ab(w.inc)}</b></div>
     <div><span>Baseline share and lead</span><b>${pc(sb[0])}, ${pt(sb[0]-sb[1])}</b></div><div><span>Registered voters</span><b>${num(w.reg)}</b></div>
     <div><span>Baseline turnout</span><b>${pc(w.tb)}</b></div><div><span>Ward candidates</span><b>${cl.total}</b></div><div><span>Boundary change score</span><b>${pc(w.boundary,0)}</b></div>
     <div><span>By-election since 2021</span><b>${w.byEl?fmt(w.byEl.day):"None"}</b></div><div><span>Evidence last confirmed</span><b>${fmt(w.lastConf)}</b></div></div>
     <p class="sub small">Ward id ${w.wid} in the 2016 delimitation. The id and ward number are real; the figures are synthetic.</p></div>
    <div class="card"><h2>Why the assessment moved ${tag("MODELLED")}</h2><div class="scroll"><table><thead><tr><th>Evidence layer</th><th class="n">${ab(w.inc)} (incumbent)</th>${r.leader!==w.inc?`<th class="n">${ab(r.leader)} (leading)</th>`:""}</tr></thead><tbody>${
     Object.keys(DRIVER).map(k=>`<tr><td>${DRIVER[k]}${S.layers[k]?"":" <small>(off)</small>"}</td><td class="n ${r.contrib[k][w.inc]<0?"down":"up"}">${pt(r.contrib[k][w.inc])}</td>
      ${r.leader!==w.inc?`<td class="n ${r.contrib[k][r.leader]<0?"down":"up"}">${pt(r.contrib[k][r.leader])}</td>`:""}</tr>`).join("")}</tbody></table></div>
     <p class="sub small">Change in vote share attributed to each layer, applied in this order.</p></div>
    <div class="card"><h2>Events acting on this ward</h2>${!S.layers.events?`<div class="box">The local events layer is switched off.</div>`:evs.length?`<div class="scroll"><table><thead><tr><th>Event</th><th>Reaches ward as</th><th class="n">Weight</th></tr></thead><tbody>${
      evs.map(x=>`<tr><td>${esc(CATS[x.e.cat].title)}<br><small>${x.e.id}, ${fmt(x.e.day)}, severity ${x.e.sev} of 5</small></td><td>${x.how}</td><td class="n">${x.weight.toFixed(2)}</td></tr>`).join("")}</tbody></table></div>
      <p class="sub small">Weight is severity times credibility times time decay times reach.</p>`:`<div class="box">No verified event is acting on this ward at ${fmt(S.day)}.</div>`}</div></div></div></div>`}

// ----------------------------------------------------------- poll comparison
function pagePolls(){const ws=S.pollProv==="ALL"?WARDS:WARDS.filter(w=>w.prov===S.pollProv);
  const rows=ws.map(w=>{const o=S.out[w.ix]; let g=0,p=0; for(let i=0;i<NP;i++){const x=o.A.sh[i]-o.B.sh[i]; if(Math.abs(x)>Math.abs(g)){g=x;p=i}}
    return {w,o,g,p,la:argmax(o.A.sh),lb:S.res[w.ix].leader}});
  const differ=rows.filter(x=>x.la!==x.lb).length, avg=rows.reduce((a,x)=>a+Math.abs(x.g),0)/rows.length, own=rows.filter(x=>x.o.A.src==="ward").length;
  const top=rows.sort((a,b)=>Math.abs(b.g)-Math.abs(a.g)).slice(0,40);
  const lead=(x,i)=>`${sw(i)}${ab(i)} ${pc(x.sh[i],0)}`, SRC={ward:"Ward survey",metro:"Metro poll, swing",province:"Provincial poll, swing"};
  return head("Poll comparison","The core experiment: the poll alone (A), the model without polls (B) and the two combined (C), ward by ward. Sorted by where poll and model disagree most.",
    `<label>Province ${provSelect("pollProv",S.pollProv,true)}</label>`)+`<div class="stack">
  <div class="stats">${stat("Wards compared",num(rows.length))}${stat("Poll and model name different leaders",num(differ),pc(differ/rows.length,0)+" of wards")}
   ${stat("Average largest gap",(100*avg).toFixed(1)+" pts","Between A and B, on the party where they differ most")}${stat("Wards with their own survey",num(own),"The rest rely on a metro or provincial poll")}</div>
  ${S.layers.polls?"":`<div class="box">The poll layer is switched off in Model settings, so output C equals output B.</div>`}
  <div class="card"><h2>Largest disagreements ${tag("MEASUREMENT")} ${tag("MODELLED")} ${syn}</h2><div class="scroll"><table><thead><tr><th>Ward</th><th>Poll source</th><th>A. Poll only</th><th>B. Model without polls</th><th>C. Combined</th><th class="n">Largest gap, A minus B</th><th class="n">Poll weight in C</th></tr></thead><tbody>${
    top.map(x=>{const lc=argmax(x.o.C.sh);return `<tr class="pick"><td>${wardLink(x.w,wardName(x.w))}<br><small>${PROVS[x.w.prov]}</small></td><td>${SRC[x.o.A.src]}${x.o.A.src==="ward"?", "+x.w.survey.n:""}</td>
     <td>${lead(x.o.A,x.la)}</td><td class="${x.la!==x.lb?"best":""}">${lead(x.o.B,x.lb)}</td><td>${lead(x.o.C,lc)}</td>
     <td class="n ${x.g<0?"down":"up"}">${ab(x.p)} ${pt(x.g)}</td><td class="n">${pc(x.o.C.pollWeight,0)}</td></tr>`}).join("")}</tbody></table></div>
   <p class="sub small">Showing ${top.length} of ${num(rows.length)} wards. Each cell names that output's leading party and share; bold in column B marks wards where the model and the poll name different leaders.</p></div></div>`}

// -------------------------------------------------------------------- events
function pageEvents(){const m=muniOf(S.evMuni), all=S.events.filter(e=>e.mi===m.mi).sort((a,b)=>b.day-a.day);
  const status=e=>!e.verified?"Awaiting verification, not in model":e.day>S.day?"Dated after the model date, hidden":e.persistent&&e.end===null?"In model, persistent":"In model, decaying";
  const live=all.filter(e=>e.verified&&e.day<=S.day).length;
  return head("Events","Local developments recorded as structured events. Each one decays over time and can reach adjoining wards or the whole municipality.",
    `<label>Province ${provSelect("evProv",m.prov)}</label><label>Municipality ${muniSelect("evMuni",m.prov,m.code)}</label>`)+`<div class="grid2">
  <div class="card"><h2>Event register, ${m.name} ${tag("FACT")} ${syn}</h2><p class="sub small">${all.length} events on record, ${live} in the model at ${fmt(S.day)}. ${num(S.events.length)} events on record nationally.</p>
   ${all.length?`<div class="scroll"><table><thead><tr><th>Date</th><th>Event</th><th>Ward</th><th>Reach</th><th>Source</th><th>Status</th></tr></thead><tbody>${
    all.map(e=>`<tr><td>${fmt(e.day)}</td><td>${esc(CATS[e.cat].title)}<br><small>${e.id}, ${CATS[e.cat].label}, severity ${e.sev} of 5, credibility ${e.cred}${e.party!==null?", linked to "+ab(e.party):""}</small></td>
     <td>${wardLink(wardById(e.ward),String(wardById(e.ward).no))}</td><td>${e.scope==="ward"?"Ward":"Municipality"}</td><td>${e.by==="analyst"?"Analyst entry":esc(e.source)}</td><td>${status(e)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="box">No events on record for this municipality.</div>`}</div>
  <div class="card sticky"><h2>Record an event</h2><div class="form">
    <label>Ward in ${m.name}<select data-sel="evWard">${Array.from({length:m.n},(_,i)=>`<option value="${i+1}" ${S.evWard===i+1?"selected":""}>Ward ${i+1}</option>`).join("")}</select></label>
    <label>Category<select id="ev-cat">${Object.entries(CATS).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join("")}</select></label>
    <div class="two"><label>Severity, 1 to 5<input id="ev-sev" type="number" min="1" max="5" value="4"></label>
     <label>Duration<select id="ev-per"><option value="0">Short-lived</option><option value="1">Persistent</option></select></label></div>
    <label>Reach<select id="ev-scope"><option value="ward">This ward and adjoining wards</option><option value="municipality">Whole municipality</option></select></label>
    <button class="btn primary" data-act="addEvent">Record event and re-run the model</button></div>
   <p class="sub small">The event is dated ${fmt(S.day)}, marked as an analyst entry and logged in the audit trail. You are then taken to What changed.</p></div></div>`}

// ---------------------------------------------------------------- candidates
function pageCandidates(){const m=muniOf(S.candMuni), ws=wardsOf(m), t=candTotals();
  const sit=(w,cl)=>w.cand.standing?"Standing again":w.cand.switchTo!==null?"Now stands for the "+ab(w.cand.switchTo)+"; "+cl.incRow.name+" stands for the "+ab(w.inc):"Not standing; "+cl.incRow.name+" stands for the "+ab(w.inc);
  let mt=0,ms=0; ws.forEach(w=>{mt+=candList(w).total; if(w.cand.standing) ms++});

    `<label>Province ${provSelect("candProv",m.prov)}</label><label>Municipality ${muniSelect("candMuni",m.prov,m.code)}</label>`)+`<div class="stack">
  <div class="stats">${stat("Ward candidates in this demo",num(t.total),"Synthetic count across "+num(WARDS.length)+" wards")}${stat("Sitting councillor stands again",num(t.standing),pc(t.standing/WARDS.length,0)+" of wards")}
   ${stat("Sitting councillor replaced",num(t.replaced),"Same party, new candidate")}${stat("Sitting councillor switched party",num(t.switched))}${stat("Prominent independent",num(t.indep),"Wards with one standing")}</div>
  <div class="card"><h2>${m.name}, by ward ${syn}</h2><p class="sub small">${num(mt)} candidates across ${m.n} wards; the sitting councillor stands again in ${ms}. Select a ward to see its full candidate table.</p>
   <div class="scroll"><table><thead><tr><th>Ward</th><th class="n">Candidates</th><th>Sitting councillor</th><th>In this election</th><th>Independents</th><th class="n">Candidate effect on incumbent</th><th>Leading in output B</th></tr></thead><tbody>${
    ws.map(w=>{const cl=candList(w), r=S.res[w.ix], e=r.contrib.candidates[w.inc];return `<tr class="pick"><td>${wardLink(w)}</td><td class="n">${cl.total}</td><td><b>${cl.councillor}</b><br><small>${sw(w.inc)}${ab(w.inc)}</small></td><td>${sit(w,cl)}</td>
      <td>${cl.bigIndep?cl.bigIndep.name+"<br><small>Prominent independent</small>":cl.indep?cl.indep+" standing":"None"}</td><td class="n ${e<0?"down":"up"}">${pt(e)}</td><td>${sw(r.leader)}${ab(r.leader)} ${pc(r.B[r.leader],0)}</td></tr>`}).join("")}</tbody></table></div></div>
  <div class="grid2 even"><div class="card"><h2>The real picture ${tag("FACT")}</h2><table><tbody><tr><td>Certified candidates</td><td>136,790 <small>Electoral Commission, 16 September 2026</small></td></tr>
    <tr><td>Party ward candidates</td><td>98,219</td></tr><tr><td>Independent ward candidates</td><td>621</td></tr><tr><td>Party-list candidates</td><td>38,571</td></tr></tbody></table></div>
   <div class="card"><h2>About the names ${syn}</h2><p>Every candidate and councillor name in this demonstration is generated and does not refer to a real person. Names are drawn by province, never by party.</p>
    <p class="sub">The production build loads the Electoral Commission's certified list into these tables, ward by ward, with previous office, previous contests and verified candidate-specific developments, each with its source and date.</p></div></div></div>`}

// -------------------------------------------------------------- what changed
function pageChanges(){const c=S.changes;
  if(!c) return head("What changed","Each model run is compared with the one before it.")+`<div class="box">This is the first run, so there is nothing to compare yet. Advance the model date, record an event, or change a layer or parameter in Model settings.</div>`;
  const flips=c.list.filter(x=>x.lead0!==x.lead1).length;
  const row=x=>{const w=wardById(x.ward);return `<tr class="pick"><td>${wardLink(w,wardName(w))}<br><small>${PROVS[w.prov]}</small></td><td>${sw(x.party)}${ab(x.party)}</td><td class="n">${pc(x.from)}</td><td class="n">${pc(x.to)}</td>
    <td class="n ${x.d<0?"down":"up"}">${pt(x.d)}</td><td>${DRIVER[x.driver]||x.driver}</td><td>${x.lead0!==x.lead1?ab(x.lead0)+" to "+ab(x.lead1):"No change"}</td></tr>`};
  return head("What changed",`${c.run} compared with ${c.prev}, ${stamp(c.ts)}.`)+`<div class="stack">
  <div class="stats">${stat("Cause",`<em class="long">${esc(c.trigger)}</em>`)}${stat("Wards that moved",num(c.list.length),"By more than 0.1 points, of "+num(WARDS.length))}${stat("Leading party changed",flips)}</div>
  <div class="card"><h2>Largest movements ${tag("MODELLED")} ${syn}</h2>${c.list.length?`<div class="scroll"><table><thead><tr><th>Ward</th><th>Largest mover</th><th class="n">Before</th><th class="n">After</th><th class="n">Change</th><th>Driver</th><th>Leading party</th></tr></thead>
    <tbody>${c.list.slice(0,30).map(row).join("")}</tbody></table></div><p class="sub small">Showing ${Math.min(30,c.list.length)} of ${num(c.list.length)}. The driver is the evidence layer whose contribution changed most for that party.</p>`
    :`<div class="box">No ward moved by more than 0.1 points.</div>`}</div></div>`}

// ---------------------------------------------------------------- validation
function pageValidation(){const F=S.frozen, sc=S.score;
  let h=head("Validation","Freeze the three outputs before election day, then score them against the result.")+`<div class="stack"><div class="card"><div class="steps">
   <div class="step ${F?"done":""}"><i>1</i><div><h2>Freeze outputs A, B and C</h2>${F?`<div class="kv"><div><span>Frozen as</span><b>${F.run}</b></div><div><span>Frozen at</span><b>${stamp(F.ts)}</b></div><div><span>Model date</span><b>${fmt(F.day)}</b></div><div><span>Wards held</span><b>${num(F.out.length)}</b></div></div>
     <p class="sub small">Later changes to events, layers or parameters still update the live model but do not touch this set.</p>`
     :`<p>Stores the poll-only, model-without-polls and combined outputs for all ${num(WARDS.length)} wards exactly as they stand at ${fmt(S.day)}. A frozen set cannot be edited.</p><p><button class="btn primary" data-act="freeze">Freeze the three outputs</button></p>`}</div></div>
   <div class="step ${sc?"done":""}"><i>2</i><div><h2>Score against the result ${syn}</h2>${sc?`<p class="sub">Scored against a simulated result drawn from the same hidden synthetic world as the polls, with events up to election day.</p>`
     :`<p>The real election is on 4 November 2026, so there is no result yet. For this demonstration a simulated result is drawn from the same hidden synthetic world the polls came from.</p>
      <p><button class="btn primary" data-act="reveal" ${F?"":"disabled"}>Reveal simulated result and score</button></p>`}</div></div></div></div>`;
  if(!sc) return h+`</div>`;
  const rows=[["Vote-share error, all wards","mae",pts,1],["Turnout error","turn",pts,1],["Error in close wards ("+num(sc.A.nClose)+" wards, lead under 10 pts)","close",pts,1],["Error in other wards","open",pts,1],
    ["Error in fragmented contests ("+num(sc.A.nFrag)+" wards)","frag",pts,1],["Incumbent movement: direction right","dir",v=>pc(v,0),-1],["Incumbent movement: size error","mv",pts,1],
    ["Results inside the 80% interval (target 80%)","cov",v=>pc(v,0),0],["Leading party called","win",v=>pc(v,0),-1]];
  const best=(k,dirn)=>{const v=["A","B","C"].map(x=>sc[x][k]); if(v.includes(null)) return -1; return dirn===0?v.reduce((bi,x,i)=>Math.abs(x-.8)<Math.abs(v[bi]-.8)?i:bi,0):dirn>0?v.indexOf(Math.min(...v)):v.indexOf(Math.max(...v))};
  const order=["A","B","C"].sort((x,y)=>sc[x].mae-sc[y].mae), names={A:"the poll alone",B:"the model without polls",C:"the combined output"};
  return h+`<div class="stats">${stat("Lowest vote-share error",{A:"A. Poll only",B:"B. Model",C:"C. Combined"}[order[0]],pts(sc[order[0]].mae))}${stat("A. Poll only",pts(sc.A.mae))}${stat("B. Model without polls",pts(sc.B.mae))}${stat("C. Combined",pts(sc.C.mae))}</div>
  <div class="card"><h2>Scorecard ${syn}</h2><div class="scroll"><table><thead><tr><th>Measure</th><th class="n">A. Poll only</th><th class="n">B. Model without polls</th><th class="n">C. Combined</th></tr></thead><tbody>${
    rows.map(([l,k,f,d])=>{const b=best(k,d);return `<tr><td>${l}</td>${["A","B","C"].map((x,i)=>`<td class="n ${i===b?"best":""}">${f(sc[x][k])}</td>`).join("")}</tr>`}).join("")}</tbody></table></div>
   <p class="sub small">Bold is the best of the three on each measure. On vote-share error, ${names[order[0]]} came first, ahead of ${names[order[1]]} and ${names[order[2]]}. Polls record stated intention to vote, which runs well above actual turnout here. "Leading party called" is last on purpose: it is one measure among several.</p></div>
  <div class="grid2"><div class="card"><h2>Ablation: what each layer was worth</h2><div class="scroll"><table><thead><tr><th>Layer removed</th><th class="n">With it</th><th class="n">Without it</th><th class="n">Difference</th><th>Reading</th></tr></thead><tbody>${
    sc.abl.map(a=>{const d=a.without-a.full;return `<tr><td>${a.label}</td><td class="n">${pts(a.full)}</td><td class="n">${pts(a.without)}</td><td class="n ${d>0?"up":"down"}">${pt(d,2)}</td><td>${d>.0005?"Improved measurement":d<-.0005?"Made it worse":"Added little"}</td></tr>`}).join("")}</tbody></table></div>
    <p class="sub small">Each row re-runs the frozen model with one layer removed. A positive difference means the error rose without the layer, so the layer was adding information.</p></div>
   <div class="card"><h2>Vote-share error by province</h2><table><thead><tr><th>Province</th><th class="n">A</th><th class="n">B</th><th class="n">C</th></tr></thead><tbody>${
    PROV_ORDER.map(p=>{const v=["A","B","C"].map(x=>sc[x].by[p]), b=v.indexOf(Math.min(...v));return `<tr><td>${PROVS[p]}</td>${v.map((x,i)=>`<td class="n ${i===b?"best":""}">${pts(x)}</td>`).join("")}</tr>`}).join("")}</tbody></table></div></div>
  <p class="assume">${tag("ASSUMPTION")} The simulated world was built so the model's assumptions are only partly right: it responds to events at three-quarters of the assumed strength, adjoining wards do not influence each other at all, and people overstate their intention to vote by about 10 points. The scorecard shows how the test works, not how the real model will perform.</p></div>`}

   S.runs.map(r=>`<tr><td><b>${r.id}</b>${S.frozen&&S.frozen.run===r.id?"<br><small>frozen set</small>":""}</td><td>${stamp(r.ts)}</td><td>${fmt(r.day)}</td><td>${esc(r.trigger)}${r.analyst?"<br><small>analyst intervention</small>":""}</td>
   <td>${["1"].concat(LAYERS.filter(l=>r.layers[l[0]]).map(l=>l[2]==="1"?"1b":l[2])).join(", ")}</td><td class="n">${r.events}</td><td class="n">${r.moved===undefined?"":num(r.moved)}</td></tr>`).join("")}</tbody></table></div>

// ------------------------------------------------------------ model settings
const LAYER_INFO={later:"The 2024 national ballot and ward by-elections since 2021, blended into the starting point.",
 structural:"A municipal service-stress index and each ward's exposure to it, acting on the ward incumbent.",
 events:"Verified local events, with time decay and reach to adjoining wards and the municipality.",
 candidates:"Whether the sitting councillor stands again, replacements, party switches and prominent independents.",
 polls:"Ward surveys, metro polls and provincial polls. Feeds output A and the combined output C only; output B never reads it."};
function pageSettings(){const on=LAYERS.filter(l=>S.layers[l[0]]).length;
  return head("Model settings","Switch evidence layers on or off and adjust the model's assumptions. Every change re-runs the model and is logged in the audit trail.")+`<div class="grid2 even">
  <div class="card"><h2>Evidence layers</h2><p class="sub small">${on+1} of 6 on. Switching a layer off is how the ablation test works.</p>
   <div class="layerrow"><input type="checkbox" checked disabled id="l-base"><label for="l-base"><b>1 Electoral baseline</b><br><span class="sub">Historic ward results rebuilt on 2026 boundaries. Always on.</span></label></div>
   ${LAYERS.map(([k,l,n])=>`<div class="layerrow ${S.layers[k]?"":"off"}"><input type="checkbox" id="l-${k}" data-layer="${k}" ${S.layers[k]?"checked":""}><label for="l-${k}"><b>${n==="1"?"1b":n} ${l}</b><br><span class="sub">${LAYER_INFO[k]}</span></label></div>`).join("")}</div>
  <div class="card"><h2>Model parameters ${tag("ASSUMPTION")}</h2><p class="sub small">Judgement calls, not estimates. In the real build they are fitted and back-tested.</p>
   <div class="params">${Object.keys(DEFAULTS).map(k=>`<label>${PARAM_INFO[k]}<br><input type="number" step="0.05" min="0" max="2" data-param="${k}" value="${S.params[k]}"> <span>default ${DEFAULTS[k]}</span></label>`).join("")}</div>
   <p class="assume">Output B is computed by a function that takes no poll input. Switching the poll layer changes output C only.</p></div></div>`}

// --------------------------------------------------------------------- shell
const PAGES={candidates:pageCandidates,map:pageMap,province:pageProvince,muni:pageMuni,ward:pageWard,polls:pagePolls,events:pageEvents,changes:pageChanges,validation:pageValidation,audit:pageAudit,settings:pageSettings};
function render(){const cur=["province","muni","ward"].includes(S.page)?"map":S.page, off=LAYERS.filter(l=>!S.layers[l[0]]).length;
  const badge={changes:S.changes&&S.changes.list.length?`<span class="pill">${num(S.changes.list.length)}</span>`:"",settings:off?`<span class="pill">${off} off</span>`:"",validation:S.frozen&&!S.score?`<span class="pill">frozen</span>`:""};
  document.getElementById("app").innerHTML=`
  <aside class="side"><div class="side-in"><div class="brand">Ward election intelligence<small>2026 local government elections</small></div>
   <nav aria-label="Sections">${NAV.map(n=>n?`<button data-act="nav" data-id="${n[0]}" ${cur===n[0]?'aria-current="page"':""}>${n[1]}${badge[n[0]]||""}</button>`:`<div class="gap"></div>`).join("")}</nav></div></aside>
  <div class="content"><div class="flag" role="note"><b>Synthetic demonstration data.</b> Places, party names and election facts are real; every vote share, poll, event, candidate name and result is generated. Not a forecast.</div>
   <div class="top"><span>Model date <b>${fmt(S.day)}</b></span><button class="btn quiet" data-act="day" ${S.day>=LASTDAY?"disabled":""}>Advance one day</button>
    <button class="btn quiet" data-act="week" ${S.day>=LASTDAY?"disabled":""}>Advance one week</button>
    <span class="run">${S.runs[0].id}${S.frozen?", outputs frozen as "+S.frozen.run:""}</span></div>
   <main class="page">${PAGES[S.page]()}</main></div>`}
function go(page){S.page=page; window.scrollTo(0,0)}
function advance(n){const d0=S.day; S.day=Math.min(LASTDAY,S.day+n);
  const entered=S.events.filter(e=>e.verified&&e.day>d0&&e.day<=S.day).length;
  recompute(`Model date advanced from ${fmt(d0)} to ${fmt(S.day)}; ${entered} new event${entered===1?"":"s"} entered, older events decayed`)}
function act(b){const a=b.dataset.act, id=b.dataset.id;
  if(a==="nav") go(id);
  else if(a==="prov"){S.prov=id; go("province")}
  else if(a==="muni"){S.muni=id; S.prov=muniOf(id).prov; S.sort={key:"no",dir:1}; go("muni")}
  else if(a==="ward"){const w=wardById(id); S.ward=id; S.muni=MUNIS[w.mi].code; S.candMuni=S.muni; S.prov=w.prov; go("ward")}
  else if(a==="mode") S.mapMode=id;
  else if(a==="sort") S.sort=S.sort.key===id?{key:id,dir:-S.sort.dir}:{key:id,dir:id==="no"||id==="leader"?1:-1};
  else if(a==="day") advance(1); else if(a==="week") advance(7);
  else if(a==="freeze") freeze(); else if(a==="reveal") reveal();
  else if(a==="eventHere"){const w=wardById(S.ward); S.evMuni=MUNIS[w.mi].code; S.evWard=w.no; go("events")}
  else if(a==="addEvent"){const m=muniOf(S.evMuni), w=wardById(m.code+"-"+Math.min(S.evWard,m.n)), cat=document.getElementById("ev-cat").value, sev=clamp(parseInt(document.getElementById("ev-sev").value,10)||3,1,5),
      scope=document.getElementById("ev-scope").value, per=document.getElementById("ev-per").value==="1";
    const e={id:"EV-A"+String(S.events.filter(x=>x.by==="analyst").length+1).padStart(2,"0"),ward:w.id,mi:m.mi,cat,sev,day:S.day,end:per?null:S.day+3,persistent:per,scope,party:null,cred:.9,verified:true,source:"Analyst entry",by:"analyst"};
    S.events.push(e); recompute(`Event ${e.id} recorded in ${m.name} ward ${w.no}: ${CATS[cat].label.toLowerCase()}, severity ${sev}, ${scope==="ward"?"ward reach":"municipality-wide"}`,true); go("changes")}
  render()}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]"); if(b&&!b.disabled) act(b)});
document.addEventListener("keydown",ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.matches&&ev.target.matches("path[data-act]")){ev.preventDefault(); act(ev.target)}});
document.addEventListener("change",ev=>{const t=ev.target, first=p=>MUNIS.find(m=>m.prov===p).code;
  if(t.dataset.sel==="prov") S.prov=t.value;
  else if(t.dataset.sel==="muni"){S.muni=t.value; S.sort={key:"no",dir:1}}
  else if(t.dataset.sel==="pollProv") S.pollProv=t.value;
  else if(t.dataset.sel==="evProv"){S.evMuni=first(t.value); S.evWard=1}
  else if(t.dataset.sel==="evMuni"){S.evMuni=t.value; S.evWard=1}
  else if(t.dataset.sel==="evWard"){S.evWard=parseInt(t.value,10); return}
  else if(t.dataset.sel==="candProv") S.candMuni=first(t.value);
  else if(t.dataset.sel==="candMuni") S.candMuni=t.value;
  else if(t.dataset.layer){const k=t.dataset.layer; S.layers[k]=t.checked; recompute(`Layer "${LAYERS.find(l=>l[0]===k)[1]}" switched ${t.checked?"on":"off"}`,true)}
  else if(t.dataset.param){const k=t.dataset.param, v=clamp(parseFloat(t.value)||0,0,2), old=S.params[k]; if(v===old) return; S.params[k]=v; recompute(`Parameter "${PARAM_INFO[k]}" changed from ${old} to ${v}`,true)}
  else return; render()});
recompute("Initial run on the synthetic dataset"); render();
</script>
</body>
